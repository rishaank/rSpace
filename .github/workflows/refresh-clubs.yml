name: Refresh Bellarmine clubs

# The third generator on its own schedule, for the same reason the other two
# are apart: what it costs and how fast it goes stale are both different.
#
# The catalogue spends a Google Enterprise quota, so it runs daily and 25 rows
# at a time. Events are worthless the moment they are stale, so they run six
# times a day. A club roster is free and keyless like events, but it changes
# when the school year does — twice a year, near enough — so running it more
# often than weekly would just be six extra chances to commit nothing.
#
# The join to the catalogue happens inside the script, so this has to run
# after refresh-catalogue.yml rather than beside it: a park that gained
# pickleball courts this morning should be visible to Pickleball Club tonight.
# Monday 10:00 UTC is an hour after the catalogue's daily 09:00.

on:
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-clubs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # One request to bcp.org, no key, no quota. The script throws rather
      # than writing a short roster, so a Finalsite rebuild fails this job
      # loudly instead of quietly reporting that nothing at school has
      # anywhere to go.
      - name: Pull the club roster
        run: node scripts/sync-bellarmine.mjs

      - name: Commit the roster if it changed
        run: |
          if git diff --quiet -- src/lib/bellarmine.json; then
            echo "Roster unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/bellarmine.json
          git commit -m "Refresh the club roster from Bellarmine

          Generated by .github/workflows/refresh-clubs.yml. Do not edit
          src/lib/bellarmine.json by hand — re-run
          scripts/sync-bellarmine.mjs."
          git push
