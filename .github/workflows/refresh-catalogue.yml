name: Refresh the catalogue

# Why this runs here rather than "on the server": rSpace has no server. It is
# a static bundle on Vercel plus Supabase, and `src/lib/catalogue.json` is a
# build-time artifact committed to the repo — that is what lets the app boot
# with no environment variables and make no data calls at render time.
#
# So the thing that needs a schedule is the *build input*, not the app. This
# workflow regenerates the catalogue, commits it, and pushes; Vercel is
# connected to the repo, so the push is the deploy. The same run pushes the
# rows to Supabase, which keeps the bundled copy and the database in step.

on:
  schedule:
    # Daily at 09:00 UTC. Small and often beats big and rare here: the project
    # caps GetPlaceRequest at 30/day (see --limit below), so a large weekly run
    # would just hit that cap and stop. 25 a day walks the whole catalogue in
    # about a fortnight, inside the 30 days Google allows content to be cached.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Rows to refresh from Google (Enterprise-billed; project cap is 30/day)"
        default: "25"

permissions:
  contents: write

concurrency:
  group: refresh-catalogue
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    # Lifted to the job so the Supabase step can test whether the key exists.
    # A step-level `if:` cannot read the `secrets` context — only `env` — so
    # guarding on `secrets.…` directly silently evaluates to false and the
    # step never runs.
    env:
      VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Free, keyless, unquota'd. Safe to run every time.
      - name: Pull the city's open data
        run: node scripts/sync-sanjose.mjs

      # Free SKU (IDs only), but quota'd at 32/day — the quota counts requests
      # and cannot see the field mask, so it is set low enough to be safe even
      # if that mask ever widens. Only rows missing an ID are resolved, which
      # is a handful of newly published city sites per run, so the cap does not
      # bind here. It stops cleanly and keeps what it got if it ever does.
      - name: Resolve any missing Google place IDs
        if: ${{ env.VITE_GOOGLE_MAPS_API_KEY != '' }}
        run: node scripts/place-ids.mjs

      # The only paid step. Two limits bind it, and --limit respects both:
      #   1,000 / month  Places Enterprise free allowance
      #      30 / day    GetPlaceRequestPerDayPerProject, set on the project
      #                  to keep 31 days of usage under that 1,000
      # 25 a day is ~750/month and leaves the rest of the daily cap for the
      # app itself — place photos and the address picker call the same method.
      # The script skips rows refreshed in the last 14 days, so a re-run costs
      # nothing, and it stops cleanly on the daily cap rather than spinning.
      - name: Refresh ratings, reviews and quotes
        if: ${{ env.VITE_GOOGLE_MAPS_API_KEY != '' }}
        run: node scripts/refresh-places.mjs --limit ${{ inputs.limit || '25' }}

      - name: Push the rows to Supabase
        if: ${{ env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: node scripts/seed.mjs

      - name: Commit the catalogue if it changed
        run: |
          if git diff --quiet -- src/lib/catalogue.json; then
            echo "Catalogue unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/catalogue.json
          git commit -m "Refresh the catalogue from the city and Google

          Generated by .github/workflows/refresh-catalogue.yml. Do not edit
          src/lib/catalogue.json by hand — re-run scripts/sync-sanjose.mjs."
          git push
