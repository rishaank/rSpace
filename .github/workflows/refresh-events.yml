name: Refresh events

# Separate from refresh-catalogue.yml on purpose, because the two have nothing
# in common except the commit-and-push ending.
#
# The catalogue is expensive and slow-moving: it spends a Google Enterprise
# quota, so it runs once a day and walks 25 rows at a time. Events are free,
# keyless and unquota'd, and they are worthless the moment they are stale —
# "story time at 4pm" is only useful before 4pm. So this one runs six times a
# day and costs nothing to run more often than that.
#
# Same reasoning as the catalogue otherwise: rSpace has no server, events.json
# is a build input committed to the repo, Vercel builds from the repo, so the
# commit is the deploy. Six runs a day puts the worst-case staleness at four
# hours against a two-week horizon.

on:
  schedule:
    # 03:00, 07:00, 11:00, 15:00, 19:00, 23:00 UTC — roughly every four hours,
    # which straddles the Pacific working day the events actually happen in.
    - cron: "0 3,7,11,15,19,23 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Never let two runs race to commit the same file. Not cancel-in-progress: a
# half-written events.json is worse than a late one.
concurrency:
  group: refresh-events
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # No key, no quota, ~30s. It walks every page because the upstream feed
      # ignores date filters and does not sort by date.
      - name: Pull library events
        run: node scripts/sync-events.mjs

      - name: Commit events if they changed
        run: |
          if git diff --quiet -- src/lib/events.json; then
            echo "Events unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/events.json
          git commit -m "Refresh events from San José Public Library

          Generated by .github/workflows/refresh-events.yml. Do not edit
          src/lib/events.json by hand — re-run scripts/sync-events.mjs."
          git push
