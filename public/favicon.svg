<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" role="img" aria-label="rSpace">
  <!-- The brand mark from src/components/ui.jsx <Mark>, on paper. Square
       corners: the design system has no rounded corners anywhere. The pin
       path here is the same one the app draws, so the tab icon and the
       in-app mark cannot drift apart. -->
  <rect width="80" height="80" fill="#f5f2e8"/>
  <g transform="translate(8 4)">
    <path d="M6 2h52a4 4 0 0 1 4 4v44a4 4 0 0 1-4 4H40l-8 14-8-14H6a4 4 0 0 1-4-4V6a4 4 0 0 1 4-4z" fill="#1f4436"/>
    <!-- Newsreader is a web font and a favicon renders without one, so this
         falls back to a serif. At tab size the pin is what reads anyway. -->
    <text x="32" y="43" text-anchor="middle" font-family="Newsreader,Georgia,'Times New Roman',serif" font-weight="500" font-size="42" fill="#f5f2e8">r</text>
  </g>
</svg>
